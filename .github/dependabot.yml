version: 2
updates:
  # Crates: one weekly PR that moves Cargo.lock to the newest versions
  # Cargo.toml allows, as `cargo update` does. Cargo.toml's requirements
  # are not changed, so nothing crosses a breaking version; those upgrades
  # are made by hand. CI's msrv job catches an update that needs a newer
  # Rust than rust-version.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      crates:
        patterns: ["*"]

  # The workflow's actions, in one weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
