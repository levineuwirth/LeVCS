name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that an advisory published against a locked crate fails a
  # run even in a week with no pushes.
  schedule:
    - cron: "23 5 * * 1"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Gate: workspace must build and the full test suite must pass.
  # Includes a compile-check of the criterion benches so a broken
  # bench doesn't go unnoticed between manual `cargo bench` runs.
  # --locked: a Cargo.toml change committed without its Cargo.lock fails
  # here, rather than CI building a lockfile nobody committed.
  test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --locked

      # The deployment gate, on the binaries just built: deploy/README.md,
      # "Run the gate".
      - name: Deployment gate
        run: target/debug/levcs-gate

      - name: Compile-check benches
        run: cargo build --workspace --benches --locked

  # Gate: the workspace builds on the rust-version Cargo.toml declares. The
  # version is read from Cargo.toml, so the two cannot drift apart.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --workspace --all-targets --locked

  # Gate: no locked crate has a known vulnerability in the RustSec
  # database. Unmaintained and unsound crates are reported as warnings and
  # do not fail the job.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - run: cargo audit

  # Gate: the Phase 1 storage spine's own gate. The workspace tests above
  # build levcs-store with its default features only; this runs it under the
  # feature configurations the crash matrix, the harness and store-bench need,
  # and checks the golden frame corpus and the crash matrix's rows.
  phase1:
    name: phase 1 gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-phase1.sh

  # Gate: the executable specification of the authority rules
  # (authority-spec/README.md). Its properties hold, levcs-identity gives
  # every generated scenario the verdicts the specification gives it, and
  # levcs-cli's receive keeps or refuses every generated transfer as it
  # says. The corpus replays need no Haskell and run with the workspace
  # tests above.
  authority-spec:
    name: authority spec
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: haskell-actions/setup@v2
        id: haskell
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.16"

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.haskell.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-ghc-9.10.3-${{ hashFiles('authority-spec/cabal.project.freeze') }}

      # Built first, so that a Rust build failure is reported as one.
      - name: Build the oracles
        run: |
          cargo build --release --locked -p levcs-identity --example spec_oracle
          cargo build --release --locked -p levcs-cli --example spec_receive_oracle

      - name: The rules against themselves
        working-directory: authority-spec
        run: cabal test properties --test-show-details=direct

      - name: The rules against levcs-identity and levcs-cli
        working-directory: authority-spec
        run: cabal test differential --test-show-details=direct
        env:
          LEVCS_SPEC_TESTS: "20000"

  # Gate: the codebase is fmt-clean; keep it that way.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Gate: no clippy warning at default severity, in every crate but
  # levcs-store, the Phase 1 storage spine, whose warnings are not yet
  # fixed. The toolchain is pinned so
  # that the lints a new release adds arrive in a commit that moves the pin,
  # not in an unrelated pull request.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude levcs-store --all-targets --locked -- -D warnings
